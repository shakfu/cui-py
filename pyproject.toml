[project]
name = "cui-py"
version = "0.1.0"
description = "Cython bindings for the cui UI framework"
readme = "README.md"
# The extension embeds CUI (MIT) and its fonts: Inter and Geist (OFL-1.1), Lucide (ISC).
license = "MIT AND OFL-1.1 AND ISC"
license-files = [
    "LICENSE",
    "thirdparty/cui/LICENSE",
    "thirdparty/cui/THIRD_PARTY.md",
    "thirdparty/cui/assets/fonts/LICENSE-*.txt",
]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["cui", "ui", "cython", "bindings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Cython",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "twine>=7.0.0",
]

[build-system]
# Cython 3.1 is the first release with Limited API support.
requires = ["scikit-build-core>=1.1.2", "cython>=3.1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/cui"]
# One cp310-abi3 wheel per platform covers CPython 3.10+.
wheel.py-api = "cp310"
install.components = ["python"]
# The generator and its stub templates are dev tools; thirdparty/ builds the extension.
sdist.include = ["thirdparty/cui"]
cmake.args = []
cmake.define = {}
cmake.build-type = "Release"
cmake.source-dir = "."
sdist.exclude = []
wheel.exclude = []

[tool.ruff]
# Generated by tools/gen_bindings.py; mypy still checks it.
extend-exclude = ["src/cui/_core.pyi"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
# The compiled extension ships no stubs. Everything else stays checked.
module = "cui._core"
ignore_missing_imports = true

